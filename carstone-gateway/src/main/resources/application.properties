quarkus.http.port=9220
quarkus.http.test-port=9221

gateway.services.carstone-admin.base-url=http://localhost:9200
gateway.services.carstone-front.base-url=http://localhost:9210

# CORS centralized here — the two Angular dev servers hit the gateway, never the backends
# directly (see carstone-admin/carstone-front's own application.properties, both CORS-off).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5910,http://localhost:5911
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-max-age=24H
