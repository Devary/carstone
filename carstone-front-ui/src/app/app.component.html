<header class="site-header" data-cy="site-header">
  <a routerLink="/" class="site-header-logo">Carstone</a>
  <sh-header class="site-header-nav" />
  <button
    type="button"
    class="dark-toggle"
    data-cy="dark-toggle"
    (click)="toggleDark()"
    [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <i class="pi" [class.pi-moon]="!dark()" [class.pi-sun]="dark()"></i>
  </button>
</header>
<main class="site-main">
  <router-outlet/>
</main>
<sf-footer />
<p-toast/>
