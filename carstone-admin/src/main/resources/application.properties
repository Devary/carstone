quarkus.http.port=9200
quarkus.http.test-port=9201

# MainSidebar lives in org.devary.carstone.admin, the entities themselves in
# org.devary.carstone.domain (a separate module) — both need scanning
crud.entity-packages=org.devary.carstone.domain,org.devary.carstone.admin

# carstone-domain is a plain (non-Quarkus-extension) library jar — Quarkus's build-time Jandex
# indexing doesn't automatically look inside an arbitrary dependency jar for @Entity classes,
# only the application's own module and jars that ship their own index. Without this, Hibernate
# never registers Brand/Seller/CarListing as managed entities at all.
quarkus.index-dependency.carstone-domain.group-id=org.devary
quarkus.index-dependency.carstone-domain.artifact-id=carstone-domain

# Quarkus Dev Services (ephemeral Testcontainers Postgres) was the original plan, but its
# container-sharing-across-two-independently-booted-JVMs behavior needs Testcontainers' own
# reuse opt-in (a machine-wide ~/.testcontainers.properties file) that's out of scope to write
# here — falling back to a plain static Postgres container both carstone-admin and
# carstone-front point at explicitly, same proven pattern quar-crud-host itself already uses
# (start it once: `docker run -d --name carstone-postgres -e POSTGRES_USER=carstone
# -e POSTGRES_PASSWORD=carstone-dev-only -e POSTGRES_DB=carstone -p 5460:5432 postgres:17`).
# Unlike quar-crud-host's own shared-cluster-Postgres password, this one is a throwaway
# local-only container with no real secret to protect, but still overridable via env var.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=carstone
quarkus.datasource.password=${CARSTONE_DB_PASSWORD:carstone-dev-only}
quarkus.datasource.reactive.url=postgresql://localhost:5460/carstone

# DataSeeder rebuilds everything fresh on every boot — matches the disposable-demo-data nature
# of the whole app, and Dev Services' own ephemeral container makes this the only sane choice
# anyway (nothing persists across restarts regardless).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# CORS is centralized at carstone-gateway, not duplicated here — this service is only ever
# called through the gateway (or curl/direct testing), never directly by a browser.
