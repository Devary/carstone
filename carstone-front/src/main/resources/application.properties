quarkus.http.port=9210
quarkus.http.test-port=9211

crud.entity-packages=org.devary.carstone.domain

# see carstone-admin's own application.properties for why this is needed — Quarkus's build-time
# Jandex indexing doesn't look inside an arbitrary non-Quarkus dependency jar for @Entity classes
quarkus.index-dependency.carstone-domain.group-id=org.devary
quarkus.index-dependency.carstone-domain.artifact-id=carstone-domain

# same static local Postgres container carstone-admin writes to (see its own application.properties
# for the docker run command) — carstone-front only ever reads it, never writes, enforced per-handler
# in BrandReadHandler/SellerReadHandler/CarListingReadHandler, not by this datasource config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=carstone
quarkus.datasource.password=${CARSTONE_DB_PASSWORD:carstone-dev-only}
quarkus.datasource.reactive.url=postgresql://localhost:5460/carstone

# carstone-admin owns schema creation (drop-and-create) — carstone-front must never attempt to
# (re)create it itself, and must always be started AFTER carstone-admin's first successful boot
# (no graceful wait exists here for the schema/seed data to be ready).
quarkus.hibernate-orm.schema-management.strategy=none

# CORS centralized at carstone-gateway, same reasoning as carstone-admin's own properties.
